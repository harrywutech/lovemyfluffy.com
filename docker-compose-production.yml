# Docker Compose Configuration for LoveMyFluffy.com
# Optimized for both staging (Manus) and production (Mac mini)
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose down               # Stop all services
#   docker compose logs -f            # View logs
#   docker compose restart wordpress  # Restart WordPress

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: lovemyfluffy_mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/backups:/backups
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - lovemyfluffy-network

  # WordPress Application
  wordpress:
    image: wordpress:latest
    container_name: lovemyfluffy_wordpress
    depends_on:
      - mysql
    ports:
      - "${WORDPRESS_PORT:-8660}:80"
    volumes:
      # WordPress core files
      - ./wordpress:/var/www/html
      # Uploads directory (persistent)
      - wordpress_uploads:/var/www/html/wp-content/uploads
      # Themes directory (for easy theme installation)
      - ./wordpress/theme-files:/var/www/html/wp-content/theme-files
    environment:
      # Database connection
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      
      # WordPress URLs
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WORDPRESS_HOME}');
        define('WP_SITEURL', '${WORDPRESS_SITEURL}');
        define('WP_DEBUG', ${WORDPRESS_DEBUG:-false});
        define('WP_DEBUG_LOG', ${WORDPRESS_DEBUG_LOG:-false});
        define('WP_DEBUG_DISPLAY', ${WORDPRESS_DEBUG_DISPLAY:-false});
        
        /* Memory Limits for Theme Installation */
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        
        /* Upload Limits */
        @ini_set('upload_max_filesize', '64M');
        @ini_set('post_max_size', '64M');
        @ini_set('max_execution_time', '300');
        @ini_set('max_input_time', '300');
    restart: unless-stopped
    networks:
      - lovemyfluffy-network

  # phpMyAdmin (Optional - for database management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: lovemyfluffy_phpmyadmin
    depends_on:
      - mysql
    ports:
      - "${PHPMYADMIN_PORT:-8661}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M
    restart: unless-stopped
    networks:
      - lovemyfluffy-network
    profiles:
      - tools  # Only start with: docker compose --profile tools up -d

volumes:
  mysql_data:
    driver: local
  wordpress_uploads:
    driver: local

networks:
  lovemyfluffy-network:
    driver: bridge
