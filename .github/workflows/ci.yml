name: CI - Build & Test

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test:
    name: Build & Test Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file for testing
        run: |
          cat > .env << 'EOF'
          # Database Configuration
          MYSQL_ROOT_PASSWORD=test_root_password
          MYSQL_DATABASE=lovemyfluffy_test
          MYSQL_USER=wordpress_test
          MYSQL_PASSWORD=test_password

          # WordPress Configuration
          WORDPRESS_DB_HOST=mysql
          WORDPRESS_DB_NAME=lovemyfluffy_test
          WORDPRESS_DB_USER=wordpress_test
          WORDPRESS_DB_PASSWORD=test_password
          WORDPRESS_HOME=http://localhost:8660
          WORDPRESS_SITEURL=http://localhost:8660
          WORDPRESS_DEBUG=true
          WORDPRESS_DEBUG_LOG=true
          WORDPRESS_DEBUG_DISPLAY=false

          # WordPress Security Keys (test only)
          WORDPRESS_AUTH_KEY=test_auth_key_12345678901234567890
          WORDPRESS_SECURE_AUTH_KEY=test_secure_auth_key_12345678901234567890
          WORDPRESS_LOGGED_IN_KEY=test_logged_in_key_12345678901234567890
          WORDPRESS_NONCE_KEY=test_nonce_key_12345678901234567890
          WORDPRESS_AUTH_SALT=test_auth_salt_12345678901234567890
          WORDPRESS_SECURE_AUTH_SALT=test_secure_auth_salt_12345678901234567890
          WORDPRESS_LOGGED_IN_SALT=test_logged_in_salt_12345678901234567890
          WORDPRESS_NONCE_SALT=test_nonce_salt_12345678901234567890

          # Nginx Configuration
          NGINX_PORT=8660
          EOF

      - name: Build Docker images
        run: |
          echo "Building nginx image..."
          docker compose build nginx

          echo "Building wordpress image..."
          docker compose build wordpress

          echo "✓ All images built successfully"

      - name: Start services
        run: |
          docker compose up -d
          echo "Waiting for services to start..."
          sleep 20

      - name: Check services are running
        run: |
          docker compose ps

          # Check if all containers are running
          if [ $(docker compose ps --status running | wc -l) -lt 3 ]; then
            echo "Error: Not all containers are running"
            docker compose logs
            exit 1
          fi

          echo "✓ All services are running"

      - name: Test MySQL connection
        run: |
          docker compose exec -T mysql mysqladmin ping -h localhost --silent
          echo "✓ MySQL is responsive"

      - name: Test WordPress installation
        run: |
          # Wait for WordPress to initialize
          sleep 10

          # Check if WordPress responds
          curl -f http://localhost:8660 || {
            echo "Error: WordPress is not responding"
            docker compose logs wordpress
            exit 1
          }

          echo "✓ WordPress is accessible"

      - name: Check for errors in logs
        if: always()
        run: |
          echo "Checking logs for errors..."
          docker compose logs nginx | grep -i error || echo "No errors in nginx logs"
          docker compose logs wordpress | grep -i "fatal\|error" || echo "No fatal errors in wordpress logs"
          docker compose logs mysql | grep -i "error" || echo "No errors in mysql logs"

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          docker system prune -f

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
